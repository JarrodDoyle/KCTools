name: Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-dromed:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build Windows
        run: dotnet publish KCTools/KCTools.csproj -c Release --property:PublishDir=${{ github.workspace }}/release/dromed/Tools/KCTools -r win-x64 --nologo
      - name: Copy DromEd Scripts
        shell: pwsh
        run: Copy-Item -Path EditorScripts\* -Destination ${{ github.workspace }}\release\dromed -Recurse -Force
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-gnu
      - name: Setup MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          version: 12.2.0
          platform: x86
      - name: Build OSM
        run: cd kctools-osm && cargo build -r && cd ../
      - name: Copy OSM
        shell: pwsh
        run: Copy-Item -Path kctools-osm\target\i686-pc-windows-gnu\release\kctools.dll -Destination ${{ github.workspace }}\release\dromed\kctools.osm
      - name: Upload DromEd
        uses: actions/upload-artifact@v4
        with:
          name: dromed_win_x64
          path: |
            ${{ github.workspace }}/release/dromed/
            !${{ github.workspace }}/release/dromed/Tools/KCTools/*.pdb
  build-win-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build Windows
        run: dotnet publish KCTools.sln -c Release --property:PublishDir=${{ github.workspace }}/release/win-x64 -r win-x64 --nologo
      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: win_x64
          path: |
            ${{ github.workspace }}/release/win-x64/
            !${{ github.workspace }}/release/win-x64/*.pdb
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build
        run: dotnet publish KCTools.sln -c Release --property:PublishDir=${{ github.workspace }}/release/linux-x64 -r linux-x64 --nologo
      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux_x64
          path: |
            ${{ github.workspace }}/release/linux-x64/
            !${{ github.workspace }}/release/linux-x64/*.dbg
            !${{ github.workspace }}/release/linux-x64/*.pdb